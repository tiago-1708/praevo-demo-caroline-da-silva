name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Build
        env:
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
        run: npm run build

      - name: Prepare Worker config
        run: node scripts/prepare-worker.mjs

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c .output/server/wrangler.json

      - name: Sync Worker runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LEAD_DESTINATION_EMAIL: ${{ secrets.LEAD_DESTINATION_EMAIL }}
          LEAD_FROM_ADDRESS: ${{ secrets.LEAD_FROM_ADDRESS }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "RESEND_API_KEY não definido — a saltar sincronização de secrets do Worker."
            exit 0
          fi
          jq -n \
            --arg r "$RESEND_API_KEY" \
            --arg d "$LEAD_DESTINATION_EMAIL" \
            --arg f "$LEAD_FROM_ADDRESS" \
            '{RESEND_API_KEY: $r, LEAD_DESTINATION_EMAIL: $d, LEAD_FROM_ADDRESS: $f}' \
            | npx wrangler secret bulk -c .output/server/wrangler.json
